<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Survey Form</title>
    </head>
    <body>
        <h1 id="title">Encuesta de Estadísticas de Edificaciones</h1>
        <p id="description">
            Por favor, complete los datos requeridos sobre la obra de edificación.
        </p>
        <form id="survey-form">
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Ingrese nombre completo o razón social"
                required
            />
            <label for="name" id="name-label">Nombre del Responsable / Empresa</label>

            <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required />
            <label for="email" id="email-label">Correo Electrónico de Contacto</label>

            <input
                type="number"
                id="number"
                name="number"
                placeholder="Número de pisos"
                min="3"
                max="15"
                required
            />
            <label for="number" id="number-label"
                >Número de Plantas / Pisos de la Edificación</label
            >

            <select id="dropdown" name="dropdown" required>
                <option value="">Selecciona el uso o destino de la edificación</option>
                <option value="opcion1">Vivienda / Residencial</option>
                <option value="opcion2">Comercial / Servicios</option>
                <option value="opcion3">Industrial / Almacenamiento</option>
            </select>

            <label id="radio-title">Tipo de obra:</label>
            <input type="radio" id="radio1" name="radio" value="opcion1" required />
            <label for="radio1">Obra Nueva</label>
            
            <input type="radio" id="radio2" name="radio" value="opcion2" required />
            <label for="radio2">Ampliación / Refacción</label>

            <label id="checkbox-title">Servicios instalados:</label>
            <input type="checkbox" id="checkbox1" name="checkbox" value="opcion1" required />
            <label for="checkbox1">Agua Potable y Alcantarillado</label>
            
            <input type="checkbox" id="checkbox2" name="checkbox" value="opcion2" required />
            <label for="checkbox2">Conexión a Red Eléctrica / Gas</label>

            <textarea
                id="textarea"
                name="textarea"
                placeholder="Describa brevemente los materiales principales o detalles adicionales de la construcción..."
                required
            ></textarea>

            <button type="submit" id="submit">Enviar Encuesta</button>
        </form>
    </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Checkout Page</title>
    </head>

    <body>
        <h1>Checkout</h1>
        <section>
            <h2>Your Cart</h2>
            <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="cubo de rubik" />
        </section>
        <section>
            <h2>Payment Information</h2>
            <form>
                <label for="card-name">Name on Card<span aria-hidden="true">*</span></label>
                <input
                    id="card-name"
                    type="text"
                    name="card-name"
                    placeholder="Name on Card"
                    required
                />

                <label for="card-number">Card Number<span aria-hidden="true">*</span></label>
                <input
                    id="card-number"
                    type="text"
                    name="card-number"
                    placeholder="1234 5678 9012 3456"
                    aria-describedby="card-number-help"
                    required
                />

                <p id="card-number-help">Enter the 16-digit card number</p>

                <label for="card-expiration"
                    >Expiration Date<span aria-hidden="true">*</span></label
                >
                <input
                    id="card-expiration"
                    type="text"
                    name="card-expiration"
                    placeholder="MM/YY"
                    required
                />

                <label for="cvc">CVC<span aria-hidden="true">*</span></label>
                <input id="cvc" type="text" name="cvc" placeholder="CVC" required />
            </form>
        </section>
    </body>
</html>
